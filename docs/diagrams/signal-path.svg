<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-label="ShackHack signal path from a cheap RTL-SDR to waterfall and speakers">
  <title>ShackHack signal path — cheap RTL-SDR</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10141c"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="dongle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a303c"/>
      <stop offset="1" stop-color="#161920"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8aa0b8"/>
    </marker>
  </defs>

  <rect width="1120" height="620" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1118" height="618" rx="18" fill="none" stroke="#2a3344"/>

  <text x="36" y="42" fill="#ffb020" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">SHACKHACK</text>
  <text x="156" y="42" fill="#8aa0b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">cheap RTL-SDR ghost box</text>
  <text x="36" y="66" fill="#5c6b80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Always-on analog sweep. Park the tuner, walk software VFOs, hop the PLL only at the window edge.</text>

  <!-- Hardware row -->
  <text x="36" y="104" fill="#5c6b80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6">HARDWARE</text>

  <!-- Antenna -->
  <g transform="translate(36,126)">
    <rect width="150" height="150" rx="12" fill="#141820" stroke="#2a3344"/>
    <line x1="75" y1="28" x2="75" y2="78" stroke="#c9d4e0" stroke-width="3"/>
    <circle cx="75" cy="22" r="5" fill="#c9d4e0"/>
    <line x1="58" y1="40" x2="92" y2="40" stroke="#c9d4e0" stroke-width="2"/>
    <line x1="62" y1="52" x2="88" y2="52" stroke="#c9d4e0" stroke-width="2"/>
    <text x="75" y="108" text-anchor="middle" fill="#e8eef6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Antenna</text>
    <text x="75" y="128" text-anchor="middle" fill="#8aa0b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">whip or mag-mount</text>
  </g>

  <line x1="196" y1="201" x2="236" y2="201" stroke="#8aa0b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="216" y="190" text-anchor="middle" fill="#5c6b80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">RF</text>

  <!-- Cheap RTL-SDR -->
  <g transform="translate(246,126)">
    <rect width="300" height="150" rx="12" fill="#141820" stroke="#ffb020" stroke-width="1.5"/>
    <!-- mini dongle drawing -->
    <rect x="28" y="28" width="22" height="36" rx="2" fill="#c9d4e0"/>
    <rect x="50" y="22" width="86" height="48" rx="6" fill="url(#dongle)" stroke="#3a4456"/>
    <circle cx="148" cy="46" r="8" fill="#8aa0b8"/>
    <circle cx="148" cy="46" r="3" fill="#141820"/>
    <line x1="156" y1="46" x2="188" y2="22" stroke="#c9d4e0" stroke-width="2"/>
    <text x="150" y="92" text-anchor="middle" fill="#ffb020" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Cheap RTL-SDR</text>
    <text x="150" y="112" text-anchor="middle" fill="#e8eef6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">RTL2832U + R820T/R820T2</text>
    <text x="150" y="130" text-anchor="middle" fill="#8aa0b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">~24 MHz–1.766 GHz · gain 0–49.6 dB</text>
  </g>

  <line x1="556" y1="201" x2="596" y2="201" stroke="#8aa0b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="576" y="190" text-anchor="middle" fill="#5c6b80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">USB</text>

  <!-- PC / WinUSB -->
  <g transform="translate(606,126)">
    <rect width="478" height="150" rx="12" fill="#141820" stroke="#2a3344"/>
    <text x="239" y="58" text-anchor="middle" fill="#e8eef6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">PC · WinUSB on Bulk-In 0</text>
    <text x="239" y="82" text-anchor="middle" fill="#8aa0b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Zadig replaces the DVB-T driver</text>
    <text x="239" y="108" text-anchor="middle" fill="#5b8cff" font-family="Consolas, ui-monospace, monospace" font-size="13">8-bit IQ @ 2.4 MS/s  ·  ~2.4 MHz instant BW</text>
    <text x="239" y="130" text-anchor="middle" fill="#8aa0b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">rs-rtl / nusb  ·  no rtlsdr.dll</text>
  </g>

  <!-- Software row -->
  <text x="36" y="316" fill="#5c6b80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6">SOFTWARE</text>

  <g transform="translate(36,334)">
    <rect width="250" height="150" rx="12" fill="#141820" stroke="#2a3344"/>
    <text x="125" y="42" text-anchor="middle" fill="#e8eef6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Park the LO</text>
    <text x="125" y="68" text-anchor="middle" fill="#8aa0b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">tuner sits on a 2.4 MHz chunk</text>
    <text x="125" y="92" text-anchor="middle" fill="#8aa0b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">crop 10% each edge</text>
    <text x="125" y="122" text-anchor="middle" fill="#3ecf8e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">PLL hops only at the edge</text>
  </g>

  <line x1="296" y1="409" x2="336" y2="409" stroke="#8aa0b8" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(346,334)">
    <rect width="300" height="150" rx="12" fill="#141820" stroke="#2a3344"/>
    <text x="150" y="36" text-anchor="middle" fill="#e8eef6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Four software VFOs</text>
    <rect x="22" y="50" width="58" height="26" rx="6" fill="#ffb020" fill-opacity="0.14" stroke="#ffb020"/>
    <text x="51" y="68" text-anchor="middle" fill="#ffb020" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">A</text>
    <rect x="88" y="50" width="58" height="26" rx="6" fill="#3ecf8e" fill-opacity="0.14" stroke="#3ecf8e"/>
    <text x="117" y="68" text-anchor="middle" fill="#3ecf8e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">B</text>
    <rect x="154" y="50" width="58" height="26" rx="6" fill="#5b8cff" fill-opacity="0.14" stroke="#5b8cff"/>
    <text x="183" y="68" text-anchor="middle" fill="#5b8cff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">C</text>
    <rect x="220" y="50" width="58" height="26" rx="6" fill="#e85d75" fill-opacity="0.14" stroke="#e85d75"/>
    <text x="249" y="68" text-anchor="middle" fill="#e85d75" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">D</text>
    <text x="150" y="102" text-anchor="middle" fill="#8aa0b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">A follows the ghost-box sweep</text>
    <text x="150" y="122" text-anchor="middle" fill="#8aa0b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">click waterfall to park B</text>
  </g>

  <line x1="656" y1="409" x2="696" y2="409" stroke="#8aa0b8" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(706,334)">
    <rect width="180" height="150" rx="12" fill="#141820" stroke="#2a3344"/>
    <text x="90" y="48" text-anchor="middle" fill="#e8eef6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Demod</text>
    <text x="90" y="76" text-anchor="middle" fill="#ffb020" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">WFM · NFM · AM</text>
    <text x="90" y="100" text-anchor="middle" fill="#8aa0b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">audio AGC</text>
    <text x="90" y="122" text-anchor="middle" fill="#8aa0b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">no squelch stop</text>
  </g>

  <line x1="896" y1="380" x2="936" y2="360" stroke="#8aa0b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="896" y1="438" x2="936" y2="458" stroke="#8aa0b8" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(946,334)">
    <rect width="138" height="68" rx="12" fill="#141820" stroke="#2a3344"/>
    <text x="69" y="42" text-anchor="middle" fill="#e8eef6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Speakers</text>
    <rect y="82" width="138" height="68" rx="12" fill="#141820" stroke="#2a3344"/>
    <text x="69" y="124" text-anchor="middle" fill="#e8eef6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Waterfall</text>
  </g>

  <text x="36" y="524" fill="#5c6b80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.6">DEFAULT SHACK-HACK</text>
  <rect x="36" y="536" width="1048" height="52" rx="10" fill="#141820" stroke="#2a3344"/>
  <text x="560" y="568" text-anchor="middle" fill="#e8eef6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">FM broadcast 88–108 MHz  ·  WFM  ·  150 kHz steps  ·  30 ms dwell  ·  bounce  ·  gain 29.6 dB</text>
</svg>
